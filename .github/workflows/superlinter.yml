#NOTICE: This new code is from Gemini. Just putting it out there.
name: Super-Linter

on: push

# Explicitly set minimal permissions to resolve 403 and Checkov errors
permissions:
  contents: read
  statuses: write

jobs:
  super-lint:
    name: Lint code base
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        # Replace the hash below with the exact SHA for the checkout version you want
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          fetch-depth: 0

      - name: Run Super-Linter
        # Replace the hash below with the exact SHA for super-linter@v8
        uses: super-linter/super-linter@b92721f792f381dc356ceb2dd5f563f4127a3777
        env:
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
