#NOTICE: The code is still from Gemini. Still putting it out there.
#However, the new SHAs are legit i.e. they're from checkout's and super-linter's repos
name: Super-Linter

on: push

# Explicitly set minimal permissions to resolve 403 and Checkov errors
permissions:
  contents: read
  statuses: write

jobs:
  super-lint:
    name: Lint code base
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        # Replace the hash below with the exact SHA for the checkout version you want
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Run Super-Linter
        # Replace the hash below with the exact SHA for super-linter@v8
        uses: super-linter/super-linter@4ce20838b8ab83717e78138c5b3a1407148e0918
        env:
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
